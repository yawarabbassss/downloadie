version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: downloadie_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - SECRET_KEY=change-this-in-production-super-secret-key-downloadie
      - STORAGE_DIR=/app/data/downloads
      - DATABASE_URL=sqlite+aiosqlite:///app/data/downloadie.db
    volumes:
      - download_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: downloadie_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  download_data:
    driver: local
